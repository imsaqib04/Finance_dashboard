swagger: '2.0'
info:
  title: Finance Dashboard API
  description: "Interactive API documentation for the Finance Data Processing Backend.
    \n\n**Roles:** \n- VIEWER: Can only access Dashboard \n- ANALYST: Can access Dashboard
    + Read Records \n- ADMIN: Full CRUD Access"
  contact:
    email: admin@finance.local
  version: v1
host: 127.0.0.1:8000
schemes:
- http
basePath: /api
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  Basic:
    type: basic
security:
- Basic: []
paths:
  /auth/login/:
    post:
      operationId: auth_login_create
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/TokenObtainPair'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/TokenObtainPair'
      tags:
      - auth
    parameters: []
  /auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/TokenRefresh'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/TokenRefresh'
      tags:
      - auth
    parameters: []
  /auth/register/:
    post:
      operationId: auth_register_create
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/Register'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/Register'
      tags:
      - auth
    parameters: []
  /auth/users/{id}/update/:
    put:
      operationId: auth_users_update_update
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/UserUpdate'
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/UserUpdate'
      tags:
      - auth
    patch:
      operationId: auth_users_update_partial_update
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/UserUpdate'
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/UserUpdate'
      tags:
      - auth
    parameters:
    - name: id
      in: path
      description: A unique integer value identifying this user.
      required: true
      type: integer
  /dashboard/summary/:
    get:
      operationId: dashboard_summary_list
      description: ''
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - dashboard
    parameters: []
  /records/:
    get:
      operationId: records_list
      description: ''
      parameters:
      - name: record_type
        in: query
        description: ''
        required: false
        type: string
      - name: category
        in: query
        description: ''
        required: false
        type: string
      - name: date_from
        in: query
        description: ''
        required: false
        type: string
      - name: date_to
        in: query
        description: ''
        required: false
        type: string
      - name: date
        in: query
        description: ''
        required: false
        type: string
      - name: min_amount
        in: query
        description: ''
        required: false
        type: string
      - name: max_amount
        in: query
        description: ''
        required: false
        type: string
      - name: ordering
        in: query
        description: Which field to use when ordering the results.
        required: false
        type: string
      - name: search
        in: query
        description: A search term.
        required: false
        type: string
      - name: page
        in: query
        description: A page number within the paginated result set.
        required: false
        type: integer
      responses:
        '200':
          description: ''
          schema:
            required:
            - count
            - results
            type: object
            properties:
              count:
                type: integer
              next:
                type: string
                format: uri
                x-nullable: true
              previous:
                type: string
                format: uri
                x-nullable: true
              results:
                type: array
                items:
                  $ref: '#/definitions/FinancialRecord'
      tags:
      - records
    post:
      operationId: records_create
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/FinancialRecord'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/FinancialRecord'
      tags:
      - records
    parameters: []
  /records/{id}/:
    get:
      operationId: records_read
      description: ''
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/FinancialRecord'
      tags:
      - records
    put:
      operationId: records_update
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/FinancialRecord'
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/FinancialRecord'
      tags:
      - records
    patch:
      operationId: records_partial_update
      description: ''
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/FinancialRecord'
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/FinancialRecord'
      tags:
      - records
    delete:
      operationId: records_delete
      description: ''
      parameters: []
      responses:
        '204':
          description: ''
      tags:
      - records
    parameters:
    - name: id
      in: path
      required: true
      type: string
definitions:
  TokenObtainPair:
    required:
    - username
    - password
    type: object
    properties:
      username:
        title: Username
        type: string
        minLength: 1
      password:
        title: Password
        type: string
        minLength: 1
  TokenRefresh:
    required:
    - refresh
    type: object
    properties:
      refresh:
        title: Refresh
        type: string
        minLength: 1
      access:
        title: Access
        type: string
        readOnly: true
        minLength: 1
  Register:
    required:
    - username
    - email
    - password
    type: object
    properties:
      username:
        title: Username
        description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
          only.
        type: string
        pattern: ^[\w.@+-]+$
        maxLength: 150
        minLength: 1
      email:
        title: Email
        type: string
        format: email
        minLength: 1
      password:
        title: Password
        type: string
        minLength: 1
      first_name:
        title: First name
        type: string
        maxLength: 150
      last_name:
        title: Last name
        type: string
        maxLength: 150
  UserUpdate:
    type: object
    properties:
      role:
        title: Role
        type: string
        enum:
        - VIEWER
        - ANALYST
        - ADMIN
      is_active:
        title: Active
        description: Designates whether this user should be treated as active. Unselect
          this instead of deleting accounts.
        type: boolean
  FinancialRecord:
    required:
    - amount
    - record_type
    - category
    - date
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      amount:
        title: Amount
        type: string
        format: decimal
      record_type:
        title: Record type
        type: string
        enum:
        - INCOME
        - EXPENSE
      category:
        title: Category
        type: string
        maxLength: 50
        minLength: 1
      date:
        title: Date
        type: string
        format: date
      notes:
        title: Notes
        type: string
        x-nullable: true
      is_deleted:
        title: Is deleted
        type: boolean
        readOnly: true
      created_by:
        title: Created by
        type: integer
        readOnly: true
        x-nullable: true
